# Gazebo sim with the 7-sonar robot, for the zig-zag run. The planar EKF with the
# same name reads spawn and sonar_max_range from here too, so they are set once:
#   ros2 launch uwr_gazebo sim.launch.py config:=sim_7sonar
#   ros2 launch kalman_filter ekf_planar_sim.launch.py config:=sim_7sonar
# Not ROS parameters: the launch files read this file to decide what to start.

# robot model, in uwr_description/urdf
robot: uwr_7sonar.urdf.xacro
# farthest echo every sonar reports [m] (5 = the generic sonar; 30 = Ping1D);
# sets the robot's sonars and the EKF's max_range
sonar_max_range: 5.0
# turns the sonar LaserScans into what the filter reads: one sensor_msgs/Range per sonar
sonar_converter: scan_to_range

# spawn pose (world = pool frame: origin at the left / bottom wall corner);
# also the EKF's start pose (init_x / init_y / init_psi)
spawn:
  # across the pool, from the left wall [m] (the zig-zag start)
  x: 1.0
  # along the pool, from the bottom wall [m]
  y: 8.0
  # heading [rad]: 0 = facing the right wall (+x), pi/2 = up the pool (+y)
  yaw: 0.7853981633974483

# sensor noise added by the sim (gaussian, zero mean). The planar EKF's own
# noise assumptions are separate: sonar_sigma, gyro_sigma, accel_sigma in
# kalman_filter config/ekf_planar/ (keep them at or above these)
noise:
  # sonar range noise, std [m], on every sonar ray
  sonar_std: 0.01
  # IMU gyro noise, std [rad/s], each axis
  imu_gyro_std: 0.0012
  # IMU accelerometer noise, std [m/s^2], each axis
  imu_accel_std: 0.006

# disturbances on the robot's motion, applied by zigzag_driver (its defaults;
# -p name:=value on the driver's command line overrides one for a run)
motion:
  # random sideways water velocity, std [m/s] (0 = off): turbulence, tether tugs
  sway_noise: 0.05
  # how slowly that sideways velocity wanders [s]
  sway_noise_tau: 2.0
  # steady water current across the pool, +x = away from the left wall [m/s]
  current_x: 0.05
  # steady water current along the pool, +y = up the pool [m/s]
  current_y: 0.05
  # random seed for sway_noise, so a noisy run can be repeated
  seed: 0

# ROS-Gazebo bridge (ros_gz_bridge parameter_bridge format; sim.launch.py writes
# this list to a temporary file for it). Every topic crossing between ROS and Gazebo.
bridge:
  - ros_topic_name: /clock
    gz_topic_name: /clock
    ros_type_name: rosgraph_msgs/msg/Clock
    gz_type_name: gz.msgs.Clock
    direction: GZ_TO_ROS

  - ros_topic_name: /imu/data
    gz_topic_name: /imu
    ros_type_name: sensor_msgs/msg/Imu
    gz_type_name: gz.msgs.IMU
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_front
    gz_topic_name: /sonar/sonar_front
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_back
    gz_topic_name: /sonar/sonar_back
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_front_left
    gz_topic_name: /sonar/sonar_front_left
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_front_right
    gz_topic_name: /sonar/sonar_front_right
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_back_left
    gz_topic_name: /sonar/sonar_back_left
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_back_right
    gz_topic_name: /sonar/sonar_back_right
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_down
    gz_topic_name: /sonar/sonar_down
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  # forces on the robot (zigzag_driver). Persistent wrenches ADD UP until cleared,
  # so the driver sends only the change in wrench each tick.
  - ros_topic_name: /world/pool/wrench/persistent
    gz_topic_name: /world/pool/wrench/persistent
    ros_type_name: ros_gz_interfaces/msg/EntityWrench
    gz_type_name: gz.msgs.EntityWrench
    direction: ROS_TO_GZ

  - ros_topic_name: /world/pool/wrench/clear
    gz_topic_name: /world/pool/wrench/clear
    ros_type_name: ros_gz_interfaces/msg/Entity
    gz_type_name: gz.msgs.Entity
    direction: ROS_TO_GZ

  - ros_topic_name: /tf
    gz_topic_name: /model/uwr/pose
    ros_type_name: tf2_msgs/msg/TFMessage
    gz_type_name: gz.msgs.Pose_V
    direction: GZ_TO_ROS

  - ros_topic_name: /pose_topic_gt
    gz_topic_name: /model/uwr/odometry
    ros_type_name: nav_msgs/msg/Odometry
    gz_type_name: gz.msgs.Odometry
    direction: GZ_TO_ROS
