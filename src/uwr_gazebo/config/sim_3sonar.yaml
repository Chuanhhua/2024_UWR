# Gazebo sim with the 3-sonar robot (surge / sway / heave), for kf_3dof or the
# planar EKF. The planar EKF with the same name reads spawn and sonar_max_range
# from here too, so they are set once:
#   ros2 launch uwr_gazebo sim.launch.py config:=sim_3sonar
#   ros2 launch kalman_filter ekf_planar_sim.launch.py config:=sim_3sonar
# Not ROS parameters: the launch files read this file to decide what to start.

# robot model, in uwr_description/urdf
robot: uwr_3sonar.urdf.xacro
# farthest echo every sonar reports [m] (30 = Ping1D); sets the robot's sonars
# and the EKF's max_range
sonar_max_range: 30.0
# turns the three sonar LaserScans into one ThreeSonarDepth on /sbs
sonar_converter: scan_to_three_sonar

# spawn pose (world = pool frame: origin at the left / bottom wall corner);
# also the EKF's start pose (init_x / init_y / init_psi)
spawn:
  # across the pool, from the left wall [m] (the pool centre)
  x: 7.5
  # along the pool, from the bottom wall [m]
  y: 12.5
  # heading [rad]: 0 = facing the right wall (+x), pi/2 = up the pool (+y)
  yaw: 1.5707963267948966

# sensor noise added by the sim (gaussian, zero mean). The planar EKF's own
# noise assumptions are separate: sonar_sigma, gyro_sigma, accel_sigma in
# kalman_filter config/ekf_planar/ (keep them at or above these)
noise:
  # sonar range noise, std [m], on every sonar ray
  sonar_std: 0.01
  # IMU gyro noise, std [rad/s], each axis
  imu_gyro_std: 0.0012
  # IMU accelerometer noise, std [m/s^2], each axis
  imu_accel_std: 0.006

# ROS-Gazebo bridge (ros_gz_bridge parameter_bridge format; sim.launch.py writes
# this list to a temporary file for it). Every topic crossing between ROS and Gazebo.
bridge:
  # Simulation clock: lets ROS nodes with use_sim_time follow Gazebo's time
  - ros_topic_name: /clock
    gz_topic_name: /clock
    ros_type_name: rosgraph_msgs/msg/Clock
    gz_type_name: gz.msgs.Clock
    direction: GZ_TO_ROS

  # IMU: renamed to /imu/data, which is what your KF subscribes to
  - ros_topic_name: /imu/data
    gz_topic_name: /imu
    ros_type_name: sensor_msgs/msg/Imu
    gz_type_name: gz.msgs.IMU
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_surge
    gz_topic_name: /sonar/sonar_surge
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_sway
    gz_topic_name: /sonar/sonar_sway
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  - ros_topic_name: /sonar/sonar_heave
    gz_topic_name: /sonar/sonar_heave
    ros_type_name: sensor_msgs/msg/LaserScan
    gz_type_name: gz.msgs.LaserScan
    direction: GZ_TO_ROS

  # True pose as TF: world -> base_link. The robot model in RViz/Foxglove follows this.
  - ros_topic_name: /tf
    gz_topic_name: /model/uwr/pose
    ros_type_name: tf2_msgs/msg/TFMessage
    gz_type_name: gz.msgs.Pose_V
    direction: GZ_TO_ROS

  # Ground truth from Gazebo, for evaluating the KF (sim only)
  - ros_topic_name: /pose_topic_gt
    gz_topic_name: /model/uwr/odometry
    ros_type_name: nav_msgs/msg/Odometry
    gz_type_name: gz.msgs.Odometry
    direction: GZ_TO_ROS
