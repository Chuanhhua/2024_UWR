# Planar EKF on the 3-sonar Gazebo sim (uwr_gazebo sim.launch.py config:=sim_3sonar).
#   ros2 launch kalman_filter ekf_planar_sim.launch.py config:=sim_3sonar
# The start pose (init_x / init_y / init_psi) and max_range are not here: the
# launch file takes them from uwr_gazebo config/sim_3sonar.yaml (spawn, sonar_max_range).
# Pool: the node's default 15 x 25 m pool; its frame is the Gazebo world frame.
# The EKF uses surge (forward) and sway (left), both at the body centre; heave
# points down and is not planar. Lists are in EKF sonar order: surge, sway.
/**:
  ros__parameters:
    # IMU input (sensor_msgs/Imu): gyro z drives the heading, accelerometer drives the velocity
    imu_topic: /imu/data

    # sonar input: one ThreeSonarDepth with all three sonars (published by scan_to_three_sonar)
    sonar_topic: /sbs
    # which ThreeSonarDepth field each sonar reads: 1 = surge, 2 = sway, 3 = heave
    sonar_fields: [1, 2]
    # sonar mount position along the body x axis (forward) [m]
    sonar_ox: [0.0, 0.0]
    # sonar mount position along the body y axis (left) [m]
    sonar_oy: [0.0, 0.0]
    # beam direction in the body frame [rad]: 0 = forward, counter-clockwise positive
    sonar_alpha: [0.0, 1.5707963267948966]

    # z of the published pose [m]: this EKF does not estimate depth
    output_z: 0.0

    # half the sonar beam cone width [rad] (0.1745 = 10 deg, as in ping1d.xacro)
    beam_half_angle: 0.1745
    # shortest range the sonar can measure [m]; closer predictions are skipped
    min_range: 0.3
    # sonar range noise, standard deviation [m] (the sim adds 1 cm; 0.02 is cautious)
    sonar_sigma: 0.02
