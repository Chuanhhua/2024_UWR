# Planar EKF on the REAL 7-sonar robot (no sim: the start pose, sonar range and
# noise values all live here, unlike the sim configs).
#   ros2 launch kalman_filter ekf_planar_real.launch.py config:=real_7sonar
# DRAFT: every "TODO" is a placeholder to replace with the real value.
# Lists are in EKF sonar order: front, back, front_left, front_right, back_left, back_right
/**:
  ros__parameters:
    # ---- inputs ----------------------------------------------------------------
    # IMU (sensor_msgs/Imu): gyro z drives the heading, accelerometer the velocity
    # TODO: the Xsens driver's topic
    imu_topic: /imu/data
    # one sensor_msgs/Range topic per sonar, in EKF order
    # TODO: the real sonar driver's topics
    range_topics: [/sonar/sonar_front/range, /sonar/sonar_back/range,
                   /sonar/sonar_front_left/range, /sonar/sonar_front_right/range,
                   /sonar/sonar_back_left/range, /sonar/sonar_back_right/range]
    # use the IMU orientation to level the accelerometer (needs orientation in the Imu msg)
    tilt_compensate: true
    # IMU gap that resets the prediction instead of integrating across it [s]
    max_imu_gap: 0.5

    # ---- sonar layout (body frame: x forward, y left, from base_link) -----------
    # TODO: measure on the robot; these are the design values
    # mount position along x (forward) [m]
    sonar_ox:    [0.15, -0.15, 0.15, 0.15, -0.15, -0.15]
    # mount position along y (left) [m]
    sonar_oy:    [0.0, 0.0, 0.15, -0.15, 0.15, -0.15]
    # beam direction [rad]: 0 = forward, counter-clockwise positive
    sonar_alpha: [0.0, 3.141592653589793, 0.7853981633974483, -0.7853981633974483,
                  2.356194490169063, -2.356194490169063]

    # ---- pool -------------------------------------------------------------------
    # TODO: measure; the pool frame's origin is the left / bottom wall corner
    # width, across the pool (x) [m]
    pool_width: 15.0
    # length, along the pool (y) [m]
    pool_length: 25.0

    # ---- sonar model --------------------------------------------------------------
    # TODO: from the sonar datasheet
    # half the beam cone width [rad] (0.1745 = 10 deg)
    beam_half_angle: 0.1745
    # shortest range the sonar can measure [m]
    min_range: 0.3
    # longest range the sonar can measure [m]
    max_range: 5.0
    # most oblique beam-to-wall angle still trusted [rad] (0.873 = 50 deg)
    max_incidence: 0.873

    # ---- noise the EKF assumes ------------------------------------------------------
    # TODO: estimate from a bag of the robot sitting still (std of each signal)
    # sonar range noise, std [m]
    sonar_sigma: 0.02
    # gyro noise, std [rad/s]
    gyro_sigma: 0.005
    # how fast the gyro bias may wander [rad/s/sqrt(s)]
    gyro_bias_walk: 0.0001
    # accelerometer noise, std [m/s^2] (also covers small biases)
    accel_sigma: 0.05
    # sideways body velocity the robot can have, std [m/s] (no-sideslip assumption)
    sideslip_sigma: 0.01

    # ---- bad readings ------------------------------------------------------------------
    # reject a sonar reading whose innovation^2 / S exceeds this (6.63 = 99%)
    gate_chi2: 6.63
    # after this many rejections in a row, trust the next reading anyway (0 = never).
    # TODO: consider 0 for real runs: a wrong-wall reading can then pull the estimate away
    gate_reset_count: 20

    # ---- start pose (pool frame) ---------------------------------------------------------
    # TODO: where the robot is placed at the start of the run
    # across the pool, from the left wall [m]
    init_x: 1.0
    # along the pool, from the bottom wall [m]
    init_y: 8.0
    # heading [rad]: 0 = facing the right wall (+x), pi/2 = up the pool (+y)
    init_psi: 0.7853981633974483
    # how sure you are of that start position, std [m]
    init_pos_sigma: 0.1
    # how sure you are of that start heading, std [rad]
    init_psi_sigma: 0.05

    # ---- output -----------------------------------------------------------------------
    # frame of the published pose: the pool frame, called "world" as in the sim
    frame_id: world
    # robot frame: the EKF publishes TF world -> base_link
    child_frame_id: base_link
    # publish that TF (for RViz / Foxglove; no other TF on the robot)
    publish_tf: true
    # pool frame -> frame_id offset [m] (0 = frame_id is the pool frame)
    pool_origin_x: 0.0
    pool_origin_y: 0.0
    # z of the published pose [m]: this EKF does not estimate depth
    output_z: 0.0
