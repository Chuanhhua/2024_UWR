# Planar EKF on the 7-sonar Gazebo sim (uwr_gazebo sim.launch.py config:=gazebo_7sonar).
#   ros2 launch kalman_filter ekf_planar_sim.launch.py   (reads this file)
# The start pose (init_x / init_y / init_psi) and max_range are not here: the
# launch file takes them from uwr_gazebo config/gazebo_7sonar.yaml (spawn, sonar_max_range).
# Pool: the node's default 15 x 25 m pool; its frame is the Gazebo world frame.
# Layout matches uwr_7sonar.urdf.xacro and the unit tests: 0.15 m from the
# centre, front / back and four corners at +-45 / +-135 deg. sonar_down is not
# planar and is left out. Lists are in EKF sonar order:
#   front, back, front_left, front_right, back_left, back_right
/**:
  ros__parameters:
    imu_topic: /imu/data             # IMU input (sensor_msgs/Imu): gyro z drives the heading, accelerometer the velocity

    range_topics: [/sonar/sonar_front/range, /sonar/sonar_back/range,      # one sensor_msgs/Range topic per sonar (from scan_to_range)
                   /sonar/sonar_front_left/range, /sonar/sonar_front_right/range,
                   /sonar/sonar_back_left/range, /sonar/sonar_back_right/range]
    sonar_ox:    [0.15, -0.15, 0.15, 0.15, -0.15, -0.15]                   # sonar mount position along the body x axis (forward) [m]
    sonar_oy:    [0.0, 0.0, 0.15, -0.15, 0.15, -0.15]                      # sonar mount position along the body y axis (left) [m]
    sonar_alpha: [0.0, 3.141592653589793, 0.7853981633974483, -0.7853981633974483,   # beam direction in the body frame [rad]: 0 = forward, CCW positive
                  2.356194490169063, -2.356194490169063]

    output_z: 0.0                    # z of the published pose [m]: this EKF does not estimate depth

    beam_half_angle: 0.1745          # half the sonar beam cone width [rad] (0.1745 = 10 deg, as in ping1d.xacro)
    min_range: 0.3                   # shortest range the sonar can measure [m]; closer predictions are skipped
    sonar_sigma: 0.01                # sonar range noise, std [m] (the sim adds 1 cm)
    sideslip_sigma: 0.08             # sideways body velocity the robot can have, std [m/s] (no-sideslip assumption); at least the sim's sway_noise and current_noise combined (sqrt(0.05^2 + 0.05^2) = 0.071 with uwr_gazebo config/gazebo_7sonar.yaml), or the EKF over-trusts it and loses its heading
